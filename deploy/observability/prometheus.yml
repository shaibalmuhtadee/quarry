global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

scrape_configs:
  - job_name: quarry-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: quarry-dispatcher
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]

  - job_name: quarry-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9465"]
