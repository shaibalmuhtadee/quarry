apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quarry

resources:
  - ../../../base/postgres

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database-credentials
    app.kubernetes.io/part-of: quarry

secretGenerator:
  # These credentials are committed for the disposable local kind environment only.
  - name: quarry-postgres
    literals:
      - database-name=quarry
      - username=quarry
      - password=quarry-kind-local
      - database-url=postgres://quarry:quarry-kind-local@postgres:5432/quarry?sslmode=disable
