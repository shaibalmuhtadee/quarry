apiVersion: v1
kind: Service
metadata:
  name: quarry-dispatcher
  labels:
    app.kubernetes.io/name: quarry-dispatcher
    app.kubernetes.io/component: dispatcher
    app.kubernetes.io/part-of: quarry
spec:
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
  selector:
    app.kubernetes.io/name: quarry-dispatcher
    app.kubernetes.io/component: dispatcher
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarry-dispatcher
  labels:
    app.kubernetes.io/name: quarry-dispatcher
    app.kubernetes.io/component: dispatcher
    app.kubernetes.io/part-of: quarry
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: quarry-dispatcher
      app.kubernetes.io/component: dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarry-dispatcher
        app.kubernetes.io/component: dispatcher
        app.kubernetes.io/part-of: quarry
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: quarry-dispatcher:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: QUARRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: quarry-postgres
                  key: database-url
            - name: QUARRY_DISPATCHER_ADDR
              value: :9090
            - name: QUARRY_DISPATCHER_METRICS_ADDR
              value: :9464
          ports:
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9464
          livenessProbe:
            grpc:
              port: 9090
              service: quarry.dispatcher.liveness
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 9090
              service: quarry.dispatcher.readiness
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
