apiVersion: v1
kind: Service
metadata:
  name: quarry-api
  labels:
    app.kubernetes.io/name: quarry-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: quarry
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: quarry-api
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarry-api
  labels:
    app.kubernetes.io/name: quarry-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: quarry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quarry-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quarry-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: quarry
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: quarry-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: QUARRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: quarry-postgres
                  key: database-url
            - name: QUARRY_HTTP_ADDR
              value: :8080
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
