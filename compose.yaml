services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: quarry
      POSTGRES_USER: quarry
      POSTGRES_PASSWORD: quarry
    ports:
      - "${QUARRY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $${POSTGRES_USER} --dbname $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
