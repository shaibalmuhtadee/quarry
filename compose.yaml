services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: quarry
      POSTGRES_USER: quarry
      POSTGRES_PASSWORD: quarry
    ports:
      - "${QUARRY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $${POSTGRES_USER} --dbname $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  migration:
    image: quarry-migration:dev
    build:
      context: .
      target: migration
    environment:
      GOOSE_DBSTRING: postgres://quarry:quarry@postgres:5432/quarry?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: quarry-api:dev
    build:
      context: .
      target: api
    environment:
      QUARRY_DATABASE_URL: postgres://quarry:quarry@postgres:5432/quarry?sslmode=disable
      QUARRY_HTTP_ADDR: :8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${QUARRY_API_PORT:-8080}:8080"
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  dispatcher:
    image: quarry-dispatcher:dev
    build:
      context: .
      target: dispatcher
    environment:
      QUARRY_DATABASE_URL: postgres://quarry:quarry@postgres:5432/quarry?sslmode=disable
      QUARRY_DISPATCHER_ADDR: :9090
      QUARRY_DISPATCHER_METRICS_ADDR: :9464
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${QUARRY_DISPATCHER_PORT:-9090}:9090"
      - "${QUARRY_DISPATCHER_METRICS_PORT:-9464}:9464"
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: quarry-worker:dev
    build:
      context: .
      target: worker
    environment:
      QUARRY_DISPATCHER_ADDR: dispatcher:9090
      QUARRY_WORKER_CONCURRENCY: "${QUARRY_WORKER_CONCURRENCY:-4}"
      QUARRY_WORKER_VERSION: compose
      QUARRY_WORKER_METRICS_ADDR: :9465
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      migration:
        condition: service_completed_successfully
      dispatcher:
        condition: service_started
    restart: unless-stopped

  prometheus:
    # Pinned to Prometheus 3.12.0 for reproducible local observability.
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    ports:
      - "${QUARRY_PROMETHEUS_PORT:-9091}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/observability/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_started
      dispatcher:
        condition: service_started
      worker:
        condition: service_started
    restart: unless-stopped

  otel-collector:
    # Pinned to the Collector Contrib 0.153.0 distribution for OTLP and health-check support.
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "${QUARRY_OTEL_GRPC_PORT:-4317}:4317"
      - "${QUARRY_OTEL_HTTP_PORT:-4318}:4318"
      - "${QUARRY_OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    # Pinned to Jaeger 2.20.0. Its built-in all-in-one config uses in-memory trace storage.
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "${QUARRY_JAEGER_PORT:-16686}:16686"
    restart: unless-stopped

  grafana:
    # Pinned to Grafana 13.1.0 for reproducible dashboard provisioning.
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${QUARRY_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
