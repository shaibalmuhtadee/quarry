syntax = "proto3";

package quarry.dispatcher.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/shaibalmuhtadee/quarry/internal/rpc/generated/dispatcher/v1;dispatcherv1";

// DispatcherService coordinates worker registration, job acquisition, lease
// heartbeats, and attempt outcome reporting.
service DispatcherService {
  // RegisterWorker records one worker process identity.
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);

  // AcquireJobs claims jobs that the worker can execute.
  rpc AcquireJobs(AcquireJobsRequest) returns (AcquireJobsResponse);

  // Heartbeat renews active attempt leases and reports stale attempts and
  // cancellation requests.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // ReportAttempt records the outcome of one acquired attempt.
  rpc ReportAttempt(ReportAttemptRequest) returns (ReportAttemptResponse);
}

message RegisterWorkerRequest {
  string worker_id = 1;
  string hostname = 2;
  string version = 3;
  uint32 concurrency = 4;
  google.protobuf.Timestamp started_at = 5;
}

message RegisterWorkerResponse {}

message AcquireJobsRequest {
  string worker_id = 1;
  uint32 available_capacity = 2;
  repeated string supported_job_types = 3;
}

message AcquireJobsResponse {
  repeated AcquiredJob jobs = 1;
}

message AcquiredJob {
  string job_id = 1;
  uint32 attempt_no = 2;
  string job_type = 3;
  bytes payload_json = 4;
  int64 timeout_ms = 5;
  string traceparent = 6;
}

message HeartbeatRequest {
  string worker_id = 1;
  repeated HeartbeatAttempt active_attempts = 2;
}

message HeartbeatAttempt {
  string job_id = 1;
  uint32 attempt_no = 2;
}

message HeartbeatResponse {
  repeated HeartbeatAttemptResult attempts = 1;
}

message HeartbeatAttemptResult {
  string job_id = 1;
  uint32 attempt_no = 2;
  HeartbeatAttemptState state = 3;
  bool cancel_requested = 4;
}

enum HeartbeatAttemptState {
  HEARTBEAT_ATTEMPT_STATE_UNSPECIFIED = 0;
  HEARTBEAT_ATTEMPT_STATE_VALID = 1;
  HEARTBEAT_ATTEMPT_STATE_STALE = 2;
}

message ReportAttemptRequest {
  string worker_id = 1;
  string job_id = 2;
  uint32 attempt_no = 3;

  oneof outcome {
    AttemptSucceeded succeeded = 4;
    AttemptFailure retryable_failure = 5;
    AttemptFailure permanent_failure = 6;
    AttemptFailure cancelled = 7;
    AttemptFailure timed_out = 8;
    AttemptFailure panicked = 9;
  }
}

message AttemptSucceeded {
  bytes result_json = 1;
}

message AttemptFailure {
  string error_code = 1;
  string error_message = 2;
}

message ReportAttemptResponse {}
